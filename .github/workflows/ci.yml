name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-package:
    needs: [test, documentation, minimal-install, document-core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.13"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install locked release tooling
        run: uv sync --frozen --extra docs --extra dev --extra html --extra docx --extra pdf
      - name: Lint and verify release gates
        run: |
          uv run ruff check
          uv run python -m tools.check_library_contracts
          uv run python -m tools.dependencies
          uv run pytest tests/test_release.py -q
          uv run python -m tools.docs check
      - name: Build and verify application archives
        run: |
          uv build --out-dir dist
          uv run python -m tools.release --dist dist
          cp vendor/opendoc/*.whl vendor/opendoc-formats/*.whl dist/
      - name: Save candidate artifacts without publishing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: textalchemy-release-candidate
          overwrite: true
          path: dist/

  document-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.13"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify bundled distribution provenance
        run: python -c "import hashlib,json,pathlib; p=pathlib.Path('vendor/opendoc'); m=json.loads((p/'provenance.json').read_text()); assert hashlib.sha256((p/m['wheel']).read_bytes()).hexdigest()==m['sha256']"
      - name: Install only the document wheel
        run: |
          uv venv --python "${{ matrix.python-version }}" .textalchemy/document-core-env
          uv pip install --python .textalchemy/document-core-env/bin/python --no-deps --no-index vendor/opendoc/*.whl
      - name: Verify independence and model contracts
        run: uv run --no-project --python "${{ matrix.python-version }}" python tools/check_document_core.py --python .textalchemy/document-core-env/bin/python

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.13"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install documentation and example dependencies
        run: uv sync --frozen --extra docs --extra dev --extra html --extra docx --extra pdf
      - name: Check documentation tooling
        run: uv run ruff check tools tests/test_documentation.py
      - name: Test documentation failure cases
        run: uv run pytest tests/test_documentation.py -q
      - name: Validate and build documentation
        run: uv run python -m tools.docs check
      - name: Save documentation site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: documentation-site
          overwrite: true
          path: .textalchemy/docs-site
          include-hidden-files: true

  minimal-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.13"
          enable-cache: true
      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install core dependencies only
        run: uv sync --frozen
      - name: Verify core imports and CLI discovery
        run: |
          uv run python -c "import textalchemy, textalchemy.convert, textalchemy.pipeline"
          uv run python -c "import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ('fitz', 'docx', 'pptx', 'PIL', 'fastapi', 'sqlalchemy'))"
          uv run textalchemy --help

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.13"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra docs --extra web --extra pdf --extra docx --extra pptx --extra html --extra epub

      - name: Install Chromium for all browser and accessibility tests
        run: uv run --no-sync playwright install --with-deps chromium

      - name: Lint with ruff
        run: uv run ruff check

      - name: Verify immutable library releases and consumer boundary
        run: uv run python -m tools.check_library_contracts

      - name: Test with pytest
        # Порог покрытия задан в pyproject.toml (`addopts = --cov-fail-under=80`).
        run: uv run pytest tests/ --cov=textalchemy --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [release-package]
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
