name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install documentation and example dependencies
        run: uv sync --frozen --extra docs --extra dev --extra html --extra docx --extra pdf
      - name: Check documentation tooling
        run: uv run ruff check tools tests/test_documentation.py
      - name: Test documentation failure cases
        run: uv run pytest tests/test_documentation.py -q
      - name: Validate and build documentation
        run: uv run python -m tools.docs check
      - name: Save documentation site
        uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: .textalchemy/docs-site
          include-hidden-files: true

  minimal-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install core dependencies only
        run: uv sync
      - name: Verify core imports and CLI discovery
        run: |
          uv run python -c "import textalchemy, textalchemy.convert, textalchemy.pipeline"
          uv run python -c "import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ('fitz', 'docx', 'pptx', 'PIL', 'fastapi', 'sqlalchemy'))"
          uv run textalchemy --help

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint with ruff
        run: uv run ruff check

      - name: Test with pytest
        # Порог покрытия задан в pyproject.toml (`addopts = --cov-fail-under=80`).
        run: uv run pytest tests/ --cov=textalchemy --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Run browser and accessibility tests
        run: uv run pytest tests/test_browser_e2e.py -v --tb=short
