name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: current, patch, minor, major or an exact version such as 0.2.0rc2
        required: true
        default: current
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SELECTOR: ${{ inputs.version || 'current' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.13"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Plan immutable release
        id: version
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo 'Release dispatch must run on main' >&2; exit 1
          fi
          VERSION=$(python -m tools.versioning plan "$SELECTOR")
          CURRENT=$(python -m tools.versioning plan current)
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo 'Tag differs from application version' >&2; exit 1
          fi
          if gh release view "v$VERSION" --json isDraft > existing-release.json 2>/dev/null; then
            python -c 'import json; assert json.load(open("existing-release.json"))["isDraft"], "Published versions cannot be replaced"'
          fi
          rm -f existing-release.json
          echo "number=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" = "$CURRENT" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
          python -m tools.versioning set "$VERSION"
      - name: Use archives from successful CI on this exact commit
        if: steps.version.outputs.changed == 'false'
        run: |
          set -euo pipefail
          RUN_ID=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=20" --jq '.workflow_runs | map(select(.head_branch == "main" and (.event == "push" or .event == "workflow_dispatch"))) | first | .id // empty')
          if [ -z "$RUN_ID" ]; then
            echo 'Run CI on this main commit before publishing its current version' >&2; exit 1
          fi
          for attempt in $(seq 1 100); do
            STATUS=$(gh run view "$RUN_ID" --json status --jq .status)
            if [ "$STATUS" = completed ]; then break; fi
            echo 'Waiting for required CI checks'; sleep 15
          done
          test "$(gh run view "$RUN_ID" --json conclusion --jq .conclusion)" = success
          gh run download "$RUN_ID" --name textalchemy-release-candidate --dir dist
          gh run download "$RUN_ID" --name documentation-site --dir .textalchemy/docs-site
      - name: Install locked verification profile
        run: uv sync --frozen --extra dev --extra docs --extra web --extra pdf --extra docx --extra pptx --extra html --extra epub
      - name: Lint and validate libraries and dependency licences
        run: |
          uv run --no-sync ruff check
          uv run --no-sync python -m tools.check_library_contracts
          uv run --no-sync python -m tools.dependencies
      - name: Update versioned documentation
        if: steps.version.outputs.changed == 'true'
        run: uv run --no-sync python -m tools.docs generate
      - name: Check documentation, examples and offline bundle
        run: uv run --no-sync python -m tools.docs check
      - name: Install Chromium
        if: steps.version.outputs.changed == 'true'
        run: uv run --no-sync playwright install --with-deps chromium
      - name: Test application and real browser scenarios
        if: steps.version.outputs.changed == 'true'
        run: uv run --no-sync pytest tests/ --cov=textalchemy --cov-report=xml --tb=short
      - name: Build and validate immutable release assets
        if: steps.version.outputs.changed == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.number }}
        run: |
          uv build --out-dir dist
          uv run --no-sync python -m tools.release --dist dist --tag "v$RELEASE_VERSION"
          cp vendor/opendoc/*.whl vendor/opendoc-formats/*.whl dist/
      - name: Recheck downloaded release archives against source
        if: steps.version.outputs.changed == 'false'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.number }}
        run: uv run --no-sync python -m tools.release --dist dist --tag "v$RELEASE_VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: documentation-site
          overwrite: true
          path: .textalchemy/docs-site
          include-hidden-files: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets
          overwrite: true
          path: dist/
      - name: Commit checked version and create release tag
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.number }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml uv.lock README.md doc/development/releases.md doc/reference src/textalchemy/web/assets/documentation.zip
          if ! git diff --cached --quiet; then
            if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
              echo 'Tagged source must already contain the release version' >&2; exit 1
            fi
            git commit -m "release: prepare v$RELEASE_VERSION"
          fi
          if git show-ref --verify --quiet "refs/tags/v$RELEASE_VERSION"; then
            test "$(git rev-parse "v$RELEASE_VERSION^{commit}")" = "$(git rev-parse HEAD)"
          else
            git tag -a "v$RELEASE_VERSION" -m "TextAlchemy $RELEASE_VERSION"
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            git push --atomic origin HEAD:main "v$RELEASE_VERSION"
          fi
      - name: Publish verified GitHub release
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.number }}
        run: |
          set -euo pipefail
          if ! gh release view "v$RELEASE_VERSION" --json isDraft > existing-release.json 2>/dev/null; then
            gh release create "v$RELEASE_VERSION" --verify-tag --draft --title "TextAlchemy $RELEASE_VERSION" --generate-notes
          else
            python -c 'import json; assert json.load(open("existing-release.json"))["isDraft"], "Published versions cannot be replaced"'
          fi
          gh release upload "v$RELEASE_VERSION" dist/* --clobber
          if [[ "$RELEASE_VERSION" =~ (a|b|rc)[0-9]+$ ]]; then
            gh release edit "v$RELEASE_VERSION" --draft=false --prerelease --latest=false
          else
            gh release edit "v$RELEASE_VERSION" --draft=false --prerelease=false --latest
          fi

  pages:
    needs: [release]
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
