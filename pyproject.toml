[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "textalchemy"
version = "0.1.0"
description = "Универсальный инструментарий обработки научно-учебных документов"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "TextAlchemy Contributors" },
]

dependencies = [
    # Core
    "pyyaml>=6.0.1",
    "platformdirs>=4.0.0",
    "pypdf>=4.0.0",
    "jinja2>=3.1.3",
    "tqdm>=4.65.0",
    "fonttools>=4.50.0",
]

[project.optional-dependencies]
pdf = [
    "pdf2docx>=0.2.0",
    "pymupdf>=1.24.0",
]
docx = [
    "python-docx>=1.1.0",
]
pptx = [
    "Pillow>=10.0.0",
    "lxml>=5.0.0",
    "python-pptx>=1.0.2",
]
epub = [
    "beautifulsoup4>=4.12.0",
    "ebooklib>=0.18.0",
]
web = [
    "fastapi>=0.109.0",
    "python-multipart>=0.0.29",
    "sqlalchemy>=2.0.50",
    "uvicorn>=0.27.0",
]
ocr = [
    "Pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "easyocr>=1.7.0",
    "paddleocr>=3.4.0",
    "paddlepaddle>=3.3.1; python_version < '3.14'",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.25.0",
    "mypy>=1.0.0",
    "ruff>=0.3.0",
    "playwright>=1.62.0",
    "axe-core-python>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/user/textalchemy"
Documentation = "https://github.com/user/textalchemy#readme"

[project.scripts]
textalchemy = "textalchemy.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Порог покрытия применяется только когда запущен `--cov` (в т.ч. CI).
addopts = "--cov-fail-under=80"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "BLE"]

[tool.ruff.lint.per-file-ignores]
"src/textalchemy/convert/pptx_to_html/*" = ["N801", "N802", "N803", "N806", "W293", "E501", "BLE001"]
"src/textalchemy/convert/pdf_to_docx.py" = ["BLE001"]
"src/textalchemy/web/main.py" = ["BLE001", "E501"]
"src/textalchemy/__main__.py" = ["N812", "BLE001"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.coverage.run]
source = ["textalchemy"]
