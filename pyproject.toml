[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "textalchemy"
version = "0.2.0rc2"
description = "Локальная конвертация, распознавание и шаблоны документов с контролем результата"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND BSD-3-Clause AND MPL-1.1"
license-files = ["doc/LICENSE", "doc/NOTICE", "doc/licenses/*"]
authors = [
    { name = "TextAlchemy Contributors" },
]

dependencies = [
    # Core
    "opendoc-model==0.7.2",
    "opendoc-formats[pdf-text,fonts]==0.18.0",
    "pyyaml>=6.0.1",
    "platformdirs>=4.0.0",
    "jinja2>=3.1.3",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
pdf = [
    "opendoc-formats[pdf]==0.18.0",
]
docx = [
    "opendoc-formats[docx]==0.18.0",
]
pptx = [
    "Pillow>=10.0.0",
    "opendoc-formats[pptx]==0.18.0",
]
epub = [
    "opendoc-formats[epub]==0.18.0",
]
html = [
    "opendoc-formats[html]==0.18.0",
]
web = [
    "Pillow>=10.0.0",
    "fastapi>=0.109.0",
    "python-multipart>=0.0.29",
    "sqlalchemy>=2.0.50",
    "uvicorn>=0.27.0",
]
ocr = [
    "Pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "easyocr>=1.7.0",
    "torch==2.10.0",  # Audited CUDA component graph; avoids the meta-wheel with unverified licence.
    "torchvision==0.25.0",  # Published companion requires this exact Torch version.
    "paddleocr>=3.4.0",
    "aistudio-sdk>=0.3.9",  # Published Apache-2.0 licence; 0.3.8 has unknown licence metadata.
    "paddlepaddle>=3.3.1; python_version < '3.14'",
]
docs = [
    "mkdocs>=1.6.1,<2",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.25.0",
    "mypy>=1.0.0",
    "ruff>=0.3.0",
    "playwright>=1.62.0",
    "axe-core-python>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/SergeiLitvinov/TextAlchemy"
Documentation = "https://SergeiLitvinov.github.io/TextAlchemy/"

[project.scripts]
textalchemy = "textalchemy.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Порог покрытия применяется только когда запущен `--cov` (в т.ч. CI).
addopts = "--cov-fail-under=80"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "BLE"]

[tool.ruff.lint.per-file-ignores]
"src/textalchemy/web/main.py" = ["BLE001", "E501"]
"src/textalchemy/__main__.py" = ["N812", "BLE001"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.coverage.run]
source = ["textalchemy"]

[tool.uv.sources]
opendoc-model = { path = "vendor/opendoc-model/opendoc_model-0.7.2-py3-none-any.whl" }
opendoc-formats = { path = "vendor/opendoc-formats/opendoc_formats-0.18.0-py3-none-any.whl" }
