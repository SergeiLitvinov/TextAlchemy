site_name: TextAlchemy — документация
site_description: Документы в нужном формате. Результат под контролем.
docs_dir: .textalchemy/docs-source
site_dir: .textalchemy/docs-site
theme:
  name: mkdocs
  custom_dir: doc/theme
  locale: ru
  highlightjs: false
plugins:
  - search:
      lang: [ru, en]
extra_css:
  - doc/assets/documentation.css
extra_javascript:
  - doc/assets/documentation.js
markdown_extensions:
  - tables
  - fenced_code
  - toc:
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode
hooks:
  - tools/documentation/hook.py
watch:
  - doc
  - src/textalchemy
  - tests
  - TODO.md
  - README.md
  - doc/development/AGENTS.md
  - doc/development/CODING_STANDARDS.md
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn
nav:
  - Главная: README.md
  - Руководство:
      - Выбрать задачу: doc/reference/user-guide.md
      - Начать работу: doc/guide/index.md
      - Конвертация: doc/guide/conversion.md
      - Распознавание: doc/guide/recognition.md
      - Шаблоны: doc/guide/templates.md
      - Библиография: doc/guide/bibliography.md
      - Автоматизация: doc/guide/automation.md
      - Хранение: doc/guide/storage.md
      - Проверка качества: doc/guide/verification.md
      - Подробности форматов: doc/guide/formats.md
      - Контракты Web/API: doc/guide/web-details.md
  - План по вехам: doc/development/roadmap.md
  - Справочники:
      - Команды CLI: doc/reference/cli.md
      - Операции конвейера: doc/reference/operations.md
      - Зависимости и лицензии: doc/reference/dependencies.md
  - Выпуск:
      - Версии и релизы: doc/development/releases.md
      - Лицензионный аудит: doc/development/licenses.md
  - Разработка:
      - Навигатор по коду: doc/reference/code.md
      - Web-маршруты: doc/reference/web-routes.md
      - Система документации: doc/development/documentation.md
      - Библиотека документов: doc/development/document-library.md
      - Запросы к OpenDoc: doc/development/library-requests/opendoc.md
      - Контракты и план OpenDoc Formats: doc/development/library-requests/opendoc-formats.md
      - Повторное чтение заголовков DOCX: doc/development/library-requests/heading-roundtrip.md
      - Текст и пагинация пользовательского DOCX: doc/development/library-requests/docx-user-layout.md
      - Непрозрачные SmartArt и OLE: doc/development/library-requests/docx-smartart-ole.md
      - Границы DOCX-таблицы: doc/development/library-requests/docx-table-borders.md
      - Обрезка и наложения PDF: doc/development/library-requests/pdf-compositing.md
      - Интерактивные объекты и страницы PDF: doc/development/library-requests/pdf-interactions-export.md
      - Геометрия сканированного PDF: doc/development/library-requests/pdf-scan-geometry.md
      - Нативное оформление сложного PPTX: doc/development/library-requests/pptx-native-visual.md
      - Приёмка HTML-семантики: doc/development/library-requests/html-accessibility.md
      - Интерфейс шаблонизатора: doc/development/templating.md
      - Собранная зависимость OpenDoc: doc/development/vendor-opendoc.md
      - Собранные адаптеры: doc/development/vendor-opendoc-formats.md
      - Устройство проекта: doc/development/AGENTS.md
      - Стандарты: doc/development/CODING_STANDARDS.md
      - Приёмка текстового слоя DjVu: doc/development/library-requests/djvu-text.md
      - Решение по XLSX/ODS: doc/development/spreadsheets.md
      - Корпус: doc/development/corpus.md
      - Происхождение Office-файлов: doc/development/office-corpus.md
  - Карта документации: doc/README.md
