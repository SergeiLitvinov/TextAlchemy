<details id="sourceEditor" name="template-tools" class="workspace-disclosure">
    <summary>Сделать значение полем шаблона</summary>
    <p>Найдите конкретное значение в образце и отметьте связанные вхождения. Разные роли людей выбирайте отдельно, даже если имя совпадает.</p>
    <button id="sourceInspect" type="button">Показать текст образца</button>
    <div id="sourceFields" hidden>
    <label for="sourceBlocks">Абзац, таблица или колонтитул</label><select id="sourceBlocks"></select>
    <p id="sourceContext" class="source-context"></p>
    <div id="sourceSuggestions" class="row-actions" role="group" aria-label="Возможные заменяемые значения"></div>
    <label for="sourceQuery">Точный текст для замены</label><textarea id="sourceQuery" rows="2" maxlength="2000"></textarea>
    <button id="sourceSearch" type="button">Найти вхождения</button>
    <div id="sourceMatches" role="group" aria-label="Вхождения значения"></div>
    <label for="sourceLabel">Как назвать поле</label><input id="sourceLabel" maxlength="100" placeholder="Например, ФИО руководителя">
    <button id="sourceSave" type="button" disabled>Сохранить копию с полем</button>
    </div>
</details>
