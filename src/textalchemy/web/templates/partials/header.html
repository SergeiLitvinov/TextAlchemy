<header class="header">
    <button class="icon-button nav-toggle" type="button" data-nav-open aria-controls="app-sidebar" aria-expanded="false" aria-label="Открыть меню">
        <svg class="ui-icon" aria-hidden="true"><use href="#icon-menu"/></svg>
    </button>
    <a class="brand" href="/" aria-label="TextAlchemy — главная">
        <img class="brand-mark" src="/static/favicon.svg?v={{ asset_version }}" width="36" height="36" alt="" aria-hidden="true">
        <span><h1>TextAlchemy</h1><small>Преобразование и контроль</small></span>
    </a>
    <div class="header-actions">
        <a class="icon-button" href="/help/" aria-label="Открыть руководство" title="Руководство пользователя"><svg class="ui-icon" aria-hidden="true"><use href="#icon-library"/></svg></a>
        <button class="task-center-trigger" type="button" data-task-center-open aria-controls="taskCenter" aria-expanded="false" aria-label="Открыть задачи">
            <svg class="ui-icon" aria-hidden="true"><use href="#icon-clock"/></svg><span data-i18n="header.tasks">Задачи</span><strong id="activeTaskCount" hidden>0</strong>
        </button>
        <a class="header-action" href="/convert" aria-label="Новая конвертация">+ <span data-i18n="header.new_conversion">Новая конвертация</span></a>
        <button class="language-trigger" type="button" data-language-open aria-haspopup="dialog" aria-controls="languageDialog" aria-label="Выбрать язык"><svg class="ui-icon" aria-hidden="true"><use href="#icon-language"/></svg><span>Русский</span></button>
        <button class="icon-button theme-toggle" type="button" onclick="toggleTheme()" title="Включить тёмную тему" aria-label="Включить тёмную тему"><svg class="ui-icon" aria-hidden="true"><use href="#icon-moon"/></svg></button>
    </div>
</header>
