<dialog class="language-dialog" id="languageDialog" aria-labelledby="language-title">
    <form method="dialog">
        <div class="dialog-head">
            <div><p class="eyebrow">Язык интерфейса</p><h2 id="language-title">Выберите язык</h2></div>
            <button class="icon-button" value="cancel" aria-label="Закрыть">×</button>
        </div>
        <label class="language-option">
            <input type="radio" name="interface-language" value="ru" checked>
            <span><strong>Русский</strong><small>Текущий язык</small></span>
        </label>
        <p class="dialog-note">Интерфейс готов к подключению переводов. Новые языки добавляются отдельными словарями без изменения страниц.</p>
    </form>
</dialog>
