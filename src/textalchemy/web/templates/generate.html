{% extends "base.html" %}
{% set active = 'generate' %}
{% block title %}TextAlchemy — Generate{% endblock %}
{% block content %}
    <div class="card">
        <h2>⚙️ Генерация документа</h2>
        <p>Создание документов из шаблонов с подстановкой параметров.</p>
        <form id="generate-form">
            <div class="form-grid">
                <div>
                    <label for="template">Шаблон</label>
                    <select id="template" required>
                        <option value="">— выберите шаблон —</option>
                    </select>
                </div>
                <div>
                    <label for="output">Имя выходного файла</label>
                    <input type="text" id="output" value="output.docx" required>
                </div>
            </div>
            <div class="form-group">
                <label for="params">Параметры (JSON)</label>
                <textarea id="params" rows="6">{"title": "My Document", "author": "Author Name"}</textarea>
            </div>
            <div class="form-actions">
                <button type="submit" id="genBtn">Сгенерировать</button>
            </div>
        </form>
        <div id="status" class="status-bar" style="display:none;"></div>
    </div>
{% endblock %}

{% block scripts %}
<script>
    const $ = (id) => document.getElementById(id);

    function setStatus(msg, type) {
        const el = $('status');
        if (!msg) { el.style.display = 'none'; return; }
        el.style.display = 'block';
        el.className = 'status-bar ' + (type || 'info');
        el.textContent = msg;
    }

    async function loadTemplates() {
        try {
            const templates = await api('/api/generate/templates');
            const sel = $('template');
            for (const t of templates) {
                const opt = document.createElement('option');
                opt.value = t.name;
                opt.textContent = t.name + (t.description ? ' — ' + t.description : '');
                sel.appendChild(opt);
            }
        } catch (_) { /* toast уже показан */ }
    }
    loadTemplates();

    $('generate-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const template = $('template').value;
        const output = $('output').value || 'output.docx';
        let params;
        try {
            params = $('params').value.trim() || '{}';
            JSON.parse(params);
        } catch (err) {
            toast('Параметры должны быть валидным JSON', 'error');
            setStatus('Ошибка разбора JSON параметров: ' + err.message, 'error');
            return;
        }
        const fd = new FormData();
        fd.set('template', template);
        fd.set('output', output);
        fd.set('params', params);
        const btn = $('genBtn');
        setLoading(btn, true);
        setStatus('Генерация…', 'info');
        try {
            const res = await fetch('/api/generate', { method: 'POST', body: fd });
            if (res.ok && res.headers.get('Content-Type').includes('application/json')) {
                const data = await res.json();
                setStatus('Ошибка: ' + (data.error || 'неизвестно'), 'error');
            } else if (res.ok) {
                const blob = await res.blob();
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = output;
                a.click();
                URL.revokeObjectURL(a.href);
                setStatus('Документ сгенерирован и загружен.', 'success');
                toast('Документ готов', 'success');
            } else {
                setStatus('Ошибка генерации', 'error');
            }
        } catch (err) {
            setStatus('Ошибка сети: ' + err.message, 'error');
        } finally {
            setLoading(btn, false);
        }
    });
</script>
{% endblock %}
