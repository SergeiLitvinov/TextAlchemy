{% extends "base.html" %}
{% set active = 'extract' %}
{% block title %}TextAlchemy — Извлечь{% endblock %}
{% block content %}
    <div class="card">
        <h2>Извлечение текста</h2>
        <div class="form-row">
            <div class="form-group">
                <label for="input-fmt">Формат файла</label>
                <select id="input-fmt">
                    <option value="auto">Автоопределение</option>
                    <option value="pdf">PDF</option>
                    <option value="docx">DOCX</option>
                    <option value="txt">TXT</option>
                    <option value="djvu">DJVU</option>
                </select>
            </div>
        </div>
        <div class="file-drop" id="dropZone" role="button" tabindex="0" aria-controls="fileInput" aria-label="Выбрать файл">
            <div style="font-size:3rem;margin-bottom:0.5rem;">📄</div>
            <strong>Перетащите файл сюда</strong>
            <div class="hint">или нажмите для выбора файла</div>
            <input type="file" id="fileInput" accept=".pdf,.docx,.txt,.djvu">
        </div>
    </div>

    <div class="card">
        <div class="card-head">
            <h2>Результат</h2>
            <button type="button" id="copyBtn">📋 Копировать</button>
        </div>
        <textarea id="result" readonly aria-label="Извлечённый текст" placeholder="Извлечённый текст появится здесь..."></textarea>
        <div id="status" class="status-bar" style="display:none"></div>
    </div>
{% endblock %}

{% block scripts %}
<script>
    const $ = (id) => document.getElementById(id);
    const dropZone = $('dropZone');
    const fileInput = $('fileInput');
    const resultArea = $('result');

    function setStatus(msg, type) {
        const el = $('status');
        if (!msg) { el.style.display = 'none'; return; }
        el.style.display = 'block';
        el.className = 'status-bar ' + (type || 'info');
        el.textContent = msg;
    }

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
    });
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', () => {
        if (fileInput.files[0]) handleFile(fileInput.files[0]);
    });

    async function handleFile(file) {
        setStatus('Загрузка…', 'info');
        const form = new FormData();
        form.append('file', file);
        form.append('fmt', $('input-fmt').value);
        try {
            const data = await api('/api/extract/text', { method: 'POST', formData: form });
            resultArea.value = data.text;
            setStatus(`Извлечено из «${data.filename}» (${data.text.length} символов)`, 'success');
            toast('Текст извлечён', 'success');
        } catch (_) { setStatus('', null); }
    }

    $('copyBtn').addEventListener('click', async () => {
        if (!resultArea.value) { toast('Нечего копировать', 'warning'); return; }
        try {
            await navigator.clipboard.writeText(resultArea.value);
            toast('Скопировано в буфер обмена', 'success');
        } catch (_) {
            resultArea.select();
            document.execCommand('copy');
            toast('Скопировано', 'success');
        }
    });
</script>
{% endblock %}
