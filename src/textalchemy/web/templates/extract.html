<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extract — TextAlchemy</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="header">
        <h1>⚗️ TextAlchemy</h1>
        <nav>
            <a href="/">Главная</a>
            <a href="/extract" class="active">Извлечь</a>
            <a href="/convert">Конверт</a>
            <a href="/organize">Органайз</a>
            <a href="/recognize">Распознать</a>
            <a href="/generate">Сгенерить</a>
        </nav>
    </div>
    <div class="container">
        <div class="card">
            <h2>Извлечение текста из DOCX</h2>
            <div class="file-drop" id="dropZone">
                <div style="font-size:3rem;margin-bottom:0.5rem;">📄</div>
                <strong>Перетащите DOCX файл сюда</strong>
                <div class="hint">или нажмите для выбора файла</div>
                <input type="file" id="fileInput" accept=".docx">
            </div>
        </div>
        <div class="card">
            <h2>Результат</h2>
            <textarea id="result" readonly placeholder="Извлечённый текст появится здесь..."></textarea>
            <div id="status" class="status-bar" style="display:none;"></div>
        </div>
    </div>
    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const resultArea = document.getElementById('result');
        const statusBar = document.getElementById('status');

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); });
        fileInput.addEventListener('change', () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); });

        async function handleFile(file) {
            if (!file.name.endsWith('.docx')) { showStatus('Пожалуйста, выберите DOCX файл', 'error'); return; }
            showStatus('Загрузка...', 'info');
            const form = new FormData();
            form.append('file', file);
            try {
                const res = await fetch('/api/extract/text', { method: 'POST', body: form });
                const data = await res.json();
                if (data.success) {
                    resultArea.value = data.text;
                    showStatus(`Извлечено из: ${data.filename} (${data.text.length} символов)`, 'success');
                } else {
                    showStatus(`Ошибка: ${data.error}`, 'error');
                }
            } catch (e) {
                showStatus(`Ошибка сети: ${e.message}`, 'error');
            }
        }

        function showStatus(msg, type) {
            statusBar.textContent = msg;
            statusBar.className = 'status-bar ' + type;
            statusBar.style.display = 'block';
        }
    </script>
</body>
</html>
