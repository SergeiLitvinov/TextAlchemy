{% extends "base.html" %}
{% set active = 'convert' %}
{% block title %}TextAlchemy — Конверт{% endblock %}
{% block content %}
    <div class="card">
        <h2>Конвертация</h2>
        <div class="form-row">
            <div class="form-group">
                <label>Формат на входе</label>
                <select id="input-fmt">
                    <option value="pdf">PDF → DOCX</option>
                    <option value="pptx">PPTX → HTML (zip)</option>
                    <option value="latex">DOCX → LaTeX</option>
                </select>
            </div>
            <div class="form-group" id="tool-group">
                <label>Инструмент конвертации (PDF)</label>
                <select id="tool">
                    <option value="fanout">FanOut (все движки)</option>
                    <option value="pdf2docx">pdf2docx</option>
                    <option value="pymupdf">PyMuPDF</option>
                    <option value="libreoffice">LibreOffice</option>
                </select>
            </div>
        </div>
        <div class="file-drop" id="dropZone" style="margin-top:1rem;">
            <div style="font-size:3rem;margin-bottom:0.5rem;">📄</div>
            <strong id="drop-label">Перетащите PDF файл сюда</strong>
            <div class="hint">или нажмите для выбора файла</div>
            <input type="file" id="fileInput">
        </div>
        <div id="progressWrap" style="display:none;margin-top:1rem">
            <div style="height:8px;background:var(--border);border-radius:99px;overflow:hidden">
                <div id="progressBar" style="height:100%;width:30%;background:var(--primary);transition:width .4s"></div>
            </div>
            <div id="progressText" style="font-size:.8rem;color:var(--text-muted);margin-top:.35rem">Конвертация…</div>
        </div>
        <div id="status" class="status-bar" style="display:none;"></div>
    </div>
{% endblock %}

{% block scripts %}
<script>
    const $ = (id) => document.getElementById(id);
    const dropZone = $('dropZone');
    const fileInput = $('fileInput');
    const toolSelect = $('tool');
    const fmtSelect = $('input-fmt');
    const toolGroup = $('tool-group');
    const dropLabel = $('drop-label');

    function setStatus(msg, type) {
        const el = $('status');
        if (!msg) { el.style.display = 'none'; return; }
        el.style.display = 'block';
        el.className = 'status-bar ' + (type || 'info');
        el.textContent = msg;
    }

    function setProgress(on, pct, text) {
        $('progressWrap').style.display = on ? 'block' : 'none';
        if (on) {
            $('progressBar').style.width = (pct || 30) + '%';
            if (text) $('progressText').textContent = text;
        }
    }

    fmtSelect.addEventListener('change', () => {
        const isPdf = fmtSelect.value === 'pdf';
        const isLatex = fmtSelect.value === 'latex';
        toolGroup.style.display = isPdf ? '' : 'none';
        if (isLatex) {
            dropLabel.textContent = 'Перетащите DOCX файл сюда';
            fileInput.accept = '.docx';
        } else if (isPdf) {
            dropLabel.textContent = 'Перетащите PDF файл сюда';
            fileInput.accept = '.pdf';
        } else {
            dropLabel.textContent = 'Перетащите PPTX файл сюда';
            fileInput.accept = '.pptx';
        }
    });

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); });

    async function handleFile(file) {
        const isPdf = fmtSelect.value === 'pdf';
        const isLatex = fmtSelect.value === 'latex';
        const ext = isLatex ? '.docx' : (isPdf ? '.pdf' : '.pptx');
        if (!file.name.toLowerCase().endsWith(ext)) {
            setStatus(`Пожалуйста, выберите ${ext.toUpperCase()} файл`, 'error');
            return;
        }
        const form = new FormData();
        form.append('file', file);
        form.append('tool', toolSelect.value);
        form.append('fmt', fmtSelect.value);
        setProgress(true, 30, 'Отправка файла…');
        try {
            const data = await api('/api/convert', { method: 'POST', formData: form });
            if (data.success) {
                pollTask(data.status);
            }
        } catch (_) { setProgress(false); setStatus('', null); }
    }

    async function pollTask(url) {
        try {
            const res = await fetch(url);
            if (res.headers.get('Content-Type')?.includes('application/json')) {
                const data = await res.json();
                if (data.status === 'done') {
                    setProgress(true, 90, 'Формирование файла…');
                    await downloadResult(url);
                    toast('Конвертация завершена', 'success');
                } else if (data.status === 'error') {
                    setProgress(false);
                    setStatus(`Ошибка: ${data.error}`, 'error');
                } else {
                    setProgress(true, 60, 'Конвертация…');
                    setTimeout(() => pollTask(url), 1000);
                }
            } else {
                await downloadResult(url, res);
                setProgress(false);
                setStatus('Готово! Файл загружен.', 'success');
            }
        } catch (e) {
            setProgress(false);
            setStatus(`Ошибка сети: ${e.message}`, 'error');
        }
    }

    async function downloadResult(url, res) {
        const response = res || await fetch(url);
        const blob = await response.blob();
        const disposition = response.headers.get('Content-Disposition') || '';
        const match = disposition.match(/filename="?(.+?)"?$/);
        const fname = match ? match[1] : 'converted';
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = fname;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }
</script>
{% endblock %}
